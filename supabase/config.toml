project_id = "inventory-app"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["inventorydev://auth/callback", "inventorydev://auth/callback?mode=recovery", "http://localhost:8081/auth/callback", "http://localhost:8081/auth/callback?mode=recovery"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[functions.delete-account]
# The handler verifies the bearer token using getUser. This supports new signing
# keys independently of the gateway's legacy JWT verification.
verify_jwt = false
